name: Build firmware and web flasher

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Install libraries
        run: pio pkg install -e wemos_d1_mini32
      - name: Host tests (protocol, MQTT flow, exploration scan)
        run: bash tests/run_host_tests.sh
      - name: Build firmware and web flasher files
        run: PIO_CMD=$(command -v pio) bash build_webflash.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: webflash/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webflash/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
